<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <title>MAS Tracker - Loading...</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.5);
            --secondary: #8b5cf6;
            --accent: #10b981;
            --bg: #0a0a0f;
            --surface: #12121a;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: white;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        /* ============================================
        BACKGROUND EFFECTS - STATIC
        ============================================ */

        .bg-mesh {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(16, 185, 129, 0.05) 0%, transparent 70%);
            /* Animation dihapus - background statis */
        }

        .grid-pattern {
            position: fixed;
            inset: 0;
            z-index: 1;
            opacity: 0.03;
            background-image: 
                linear-gradient(rgba(99, 102, 241, 0.5) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.5) 1px, transparent 1px);
            background-size: 50px 50px;
            /* Transform statis tanpa animation */
            transform: perspective(500px) rotateX(60deg) translateY(0);
        }
        
        /* ============================================
           MAIN CONTAINER
           ============================================ */
        
        .splash-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            padding: 2rem;
            max-width: 400px;
            width: 100%;
        }
        
        /* ============================================
           LOGO SECTION
           ============================================ */
        
        .logo-wrapper {
            position: relative;
            width: 160px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* ----- Glow Layers ----- */
        .glow-layer {
            position: absolute;
            inset: -20px;
            background: url('assets/logo-splash.png') center/contain no-repeat;
            filter: blur(20px) brightness(1.5);
            opacity: 0;
            animation: contourPulse 2.5s ease-out infinite;
            mask-image: url('assets/logo-splash.png');
            mask-size: contain;
            mask-position: center;
            -webkit-mask-image: url('assets/logo-splash.png');
            -webkit-mask-size: contain;
            -webkit-mask-position: center;
        }
        
        .glow-layer:nth-child(2) {
            inset: -35px;
            filter: blur(35px) brightness(1.2);
            animation-delay: 0.3s;
        }
        
        .glow-layer:nth-child(3) {
            inset: -50px;
            filter: blur(50px) brightness(0.8);
            animation-delay: 0.6s;
        }
        
        @keyframes contourPulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 0.9; }
        }
        
        /* ----- Ripple Effect ----- */
        .ripple-container {
            position: absolute;
            inset: -100px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        
        .ripple {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: url('assets/logo-splash.png') center/contain no-repeat;
            background-size: 60%;
            -webkit-mask: radial-gradient(circle, transparent 30%, rgba(99, 102, 241, 0.3) 70%);
            mask: radial-gradient(circle, transparent 30%, rgba(99, 102, 241, 0.3) 70%);
            animation: rippleWave 3s ease-out infinite;
            opacity: 0;
        }
        
        .ripple:nth-child(1) { animation-delay: 0s; }
        .ripple:nth-child(2) { animation-delay: 1s; }
        .ripple:nth-child(3) { animation-delay: 2s; }
        
        @keyframes rippleWave {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(2); opacity: 0; }
        }
        
        /* ----- Orbit Particles ----- */
        .logo-particles {
            position: absolute;
            inset: -80px;
            pointer-events: none;
        }
        
        .orbit-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary-glow);
            top: 50%;
            left: 50%;
            margin: -3px;
        }
        
        .orbit-particle:nth-child(1) { animation: orbit1 4s linear infinite; }
        .orbit-particle:nth-child(2) { 
            animation: orbit2 5s linear infinite; 
            background: var(--secondary); 
        }
        .orbit-particle:nth-child(3) { 
            animation: orbit3 6s linear infinite; 
            background: var(--accent);
            width: 4px;
            height: 4px;
        }
        
        @keyframes orbit1 {
            from { transform: rotate(0deg) translateX(70px) rotate(0deg); }
            to { transform: rotate(360deg) translateX(70px) rotate(-360deg); }
        }
        
        @keyframes orbit2 {
            from { transform: rotate(120deg) translateX(90px) rotate(-120deg); }
            to { transform: rotate(480deg) translateX(90px) rotate(-480deg); }
        }
        
        @keyframes orbit3 {
            from { transform: rotate(240deg) translateX(110px) rotate(-240deg); }
            to { transform: rotate(600deg) translateX(110px) rotate(-600deg); }
        }
        
        .logo-image-container {
            position: relative;
            width: 120px;
            height: 120px;
            z-index: 10;
            animation: logoFloat 3s ease-in-out infinite;
        }

        .logo-image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 30px rgba(99, 102, 241, 0.4));
            position: relative;
            z-index: 11;
            opacity: 1;
        }
        
        @keyframes logoFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
        }
        
        /* Corner Light Blink - Cahaya blink di pojok kanan atas belakang logo */
        .corner-light {
            position: absolute;
            top: -15%;
            right: -20%;
            width: 80%;
            height: 80%;
            pointer-events: none;
            z-index: 1;
        }

        /* Glow utama */
        .light-glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(
                circle at 70% 30%,
                rgba(255, 255, 255, 0.9) 0%,
                rgba(99, 102, 241, 0.6) 20%,
                rgba(139, 92, 246, 0.3) 40%,
                transparent 70%
            );
            filter: blur(8px);
            animation: blinkFast 1.5s ease-in-out infinite;
            opacity: 0;
        }

        /* Core terang */
        .light-core {
            position: absolute;
            top: 20%;
            right: 20%;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            filter: blur(4px);
            box-shadow: 
                0 0 20px rgba(255, 255, 255, 0.8),
                0 0 40px rgba(99, 102, 241, 0.6),
                0 0 60px rgba(139, 92, 246, 0.4);
            animation: blinkFast 0.8s ease-in-out infinite;
            opacity: 0;
        }

        /* Spark kecil */
        .light-spark {
            position: absolute;
            top: 25%;
            right: 25%;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px white;
            animation: blinkFast 0.8s ease-in-out infinite 0.1s;
            opacity: 0;
        }

        @keyframes blinkFast {
            0%, 100% { 
                opacity: 0;
                transform: scale(0.8);
            }
            50% { 
                opacity: 1;
                transform: scale(1.2);
            }
        }
        
        /* ============================================
           BRAND TEXT
           ============================================ */
        
        .brand-text {
            text-align: center;
            animation: fadeInUp 0.8s ease-out 0.3s both;
        }
        
        .brand-name {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }
        
        .brand-tagline {
            font-size: 0.875rem;
            color: #64748b;
            font-weight: 500;
        }
        
        .author-credit {
            margin-top: 0.5rem;
            font-size: 0.75rem;
            color: var(--primary);
            font-weight: 600;
            opacity: 0.8;
        }
        
        /* ============================================
           LOADING SECTION
           ============================================ */
        
        .loading-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }
        
        .progress-container {
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }
        
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 2px;
            animation: progressLoad 2.5s ease-out forwards;
            position: relative;
            overflow: hidden;
        }
        
        .progress-bar::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 1.5s infinite;
        }
        
        @keyframes progressLoad {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .loading-text {
            font-size: 0.75rem;
            color: #64748b;
            font-weight: 500;
            height: 1.5rem;
        }
        
        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }
        
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
            100% { content: ''; }
        }
        
        /* ============================================
           FEATURE PILLS
           ============================================ */
        
        .features {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeInUp 0.8s ease-out 0.9s both;
        }
        
        .feature-pill {
            padding: 0.5rem 1rem;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 100px;
            font-size: 0.75rem;
            color: #818cf8;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            animation: pillPulse 2s ease-in-out infinite;
        }
        
        .feature-pill:nth-child(2) { animation-delay: 0.2s; }
        .feature-pill:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes pillPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        
        /* ============================================
           FLOATING PARTICLES
           ============================================ */
        
        .particles {
            position: fixed;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            overflow: hidden;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0.5;
            animation: float 10s infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }
        
        /* ============================================
           VERSION BADGE
           ============================================ */
        
        .version-badge {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.5rem 1rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 100px;
            font-size: 0.75rem;
            color: #475569;
            font-weight: 500;
            animation: fadeInUp 0.8s ease-out 1.2s both;
        }
        
        /* ============================================
           ANIMATIONS
           ============================================ */
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* ============================================
           RESPONSIVE
           ============================================ */
        
        @media (min-width: 768px) {
            .logo-wrapper {
                width: 180px;
                height: 180px;
            }
            
            .logo-image-container {
                width: 140px;
                height: 140px;
            }
            
            .brand-name {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- ============================================
         BACKGROUND EFFECTS
         ============================================ -->
    <div class="bg-mesh"></div>
    <div class="grid-pattern"></div>
    
    <!-- ============================================
         FLOATING PARTICLES
         ============================================ -->
    <div class="particles" id="particles"></div>
    
    <!-- ============================================
         MAIN CONTENT
         ============================================ -->
    <div class="splash-container">
        
        <!-- Logo Section -->
        <div class="logo-wrapper">
            <!-- Glow Layers -->
            <div class="glow-layer"></div>
            <div class="glow-layer"></div>
            <div class="glow-layer"></div>
            
            <!-- Ripple Effect -->
            <div class="ripple-container">
                <div class="ripple"></div>
                <div class="ripple"></div>
                <div class="ripple"></div>
            </div>
            
            <!-- Orbit Particles -->
            <div class="logo-particles">
                <div class="orbit-particle"></div>
                <div class="orbit-particle"></div>
                <div class="orbit-particle"></div>
            </div>
            
            <div class="logo-image-container">
                <!-- Cahaya blink di belakang logo -->
                <div class="corner-light">
                    <div class="light-glow"></div>
                    <div class="light-core"></div>
                    <div class="light-spark"></div>
                </div>
                
                <!-- Logo PNG (tetap di depan) -->
                <img src="assets/logo-splash.png" alt="MAS Tracker Logo" id="splashLogo">
            </div>
        </div>
        
        <!-- Brand Text -->
        <div class="brand-text">
            <h1 class="brand-name">MAS Tracker</h1>
            <p class="brand-tagline">Sistem Keuangan Pintar</p>
            <p class="author-credit">by Rizki Nur Amaludin</p>
        </div>
        
        <!-- Loading Section -->
        <div class="loading-section">
            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>
            <div class="loading-text">
                <span id="loadingStatus">Memuat sistem</span>
                <span class="loading-dots"></span>
            </div>
        </div>
        
        <!-- Feature Pills -->
        <div class="features">
            <span class="feature-pill">✨ AI Powered</span>
            <span class="feature-pill">🔒 Secure</span>
            <span class="feature-pill">⚡ Fast</span>
        </div>
    </div>
    
    <!-- ============================================
         VERSION BADGE
         ============================================ -->
    <div class="version-badge">v1.0.0 Premium</div>
    
    <!-- ============================================
         JAVASCRIPT
         ============================================ -->
    <script>
        // ----- Generate Floating Particles -----
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 20; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 10 + 's';
            particle.style.animationDuration = (10 + Math.random() * 10) + 's';
            particlesContainer.appendChild(particle);
        }
        
        // ----- Loading Status Messages -----
        const messages = [
            'Memuat sistem',
            'Menyiapkan database',
            'Menginisialisasi AI',
            'Hampir selesai'
        ];
        
        let msgIndex = 0;
        const statusEl = document.getElementById('loadingStatus');
        
        const msgInterval = setInterval(() => {
            msgIndex = (msgIndex + 1) % messages.length;
            statusEl.textContent = messages[msgIndex];
        }, 600);
        
        // ----- Redirect to Main App -----
        setTimeout(() => {
            clearInterval(msgInterval);
            document.body.style.transition = 'opacity 0.5s ease';
            document.body.style.opacity = '0';
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 500);
        }, 3000);
        
        // ----- Check Standalone Mode -----
        if (window.matchMedia('(display-mode: standalone)').matches) {
            console.log('[MAS Tracker] Running in standalone mode');
        }
        
        // ----- Register Service Worker -----
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('[MAS Tracker] SW registered:', reg.scope))
                .catch(err => console.log('[MAS Tracker] SW failed:', err));
        }
        
        // ============================================
        // INTERACTIVE EFFECTS
        // ============================================
        
        document.addEventListener('DOMContentLoaded', () => {
            const logoContainer = document.querySelector('.logo-image-container');
            const logoImg = document.getElementById('splashLogo');
            
            // Parallax Effect
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth / 2 - e.pageX) / 25;
                const y = (window.innerHeight / 2 - e.pageY) / 25;
                logoContainer.style.transform = `translate(${x}px, ${y}px)`;
            });
            
            // Click Burst Effect
            logoContainer.addEventListener('click', () => {
                logoContainer.style.animation = 'none';
                logoContainer.offsetHeight;
                logoContainer.style.animation = 'logoFloat 0.5s ease-in-out, logoBounce 0.6s ease';
                createBurstParticles();
            });
            
            // Fade In on Load
            logoImg.style.opacity = '100';
            logoImg.onload = () => {
                logoImg.style.transition = 'opacity 0.5s ease';
                logoImg.style.opacity = '1';
            };
        });
        
        // ----- Burst Particles -----
        function createBurstParticles() {
            const container = document.querySelector('.logo-wrapper');
            const colors = ['#6366f1', '#8b5cf6', '#10b981'];
            
            for (let i = 0; i < 12; i++) {
                const particle = document.createElement('div');
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                particle.style.cssText = `
                    position: absolute;
                    width: 8px;
                    height: 8px;
                    background: ${color};
                    border-radius: 50%;
                    top: 50%;
                    left: 50%;
                    pointer-events: none;
                    z-index: 20;
                `;
                
                const angle = (i / 12) * Math.PI * 2;
                const velocity = 100 + Math.random() * 50;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                
                particle.style.animation = 'burstFly 0.8s ease-out forwards';
                particle.style.setProperty('--tx', `${tx}px`);
                particle.style.setProperty('--ty', `${ty}px`);
                
                container.appendChild(particle);
                setTimeout(() => particle.remove(), 800);
            }
        }
        
        // ----- Add Burst Keyframes -----
        const burstStyle = document.createElement('style');
        burstStyle.textContent = `
            @keyframes burstFly {
                0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
                100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0); opacity: 0; }
            }
            
            @keyframes logoBounce {
                0%, 100% { transform: scale(1); }
                50% { transform: scale(1.2); }
            }
        `;
        document.head.appendChild(burstStyle);
        
        // ============================================
        // DEVELOPER MODE (Auto-injected)
        // ============================================
        
        const devModeStyle = document.createElement('style');
        devModeStyle.innerHTML = '.progress-bar { animation: progressLoad 2s ease-in-out infinite !important; }';
        document.head.appendChild(devModeStyle);
        
        for (var i = 1; i < 99999; i++) window.clearTimeout(i);
        
        setInterval(() => {
            msgIndex = (msgIndex + 1) % messages.length;
            statusEl.textContent = messages[msgIndex];
        }, 600);
        
        console.warn('[MAS Tracker] DEVELOPER MODE: Splash screen locked');
    </script>
</body>
</html>
